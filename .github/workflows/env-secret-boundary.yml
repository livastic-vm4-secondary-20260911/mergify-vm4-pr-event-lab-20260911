name: Environment Secret Boundary Probe
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: vm4-env-secret-lab
    steps:
      - uses: actions/checkout@v4
      - name: Probe environment secret presence without disclosure
        env:
          VM4_ENV_SECRET_CANARY: ${{ secrets.VM4_ENV_SECRET_CANARY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash ci/env-secret-probe.sh

